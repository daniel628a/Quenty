<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>Divide la cuenta</title>
<style>
html, body { margin:0; padding:0; width:100%; }
.bs-app {
  --page-bg: #E8E3D3;
  --paper: #FBF8EF;
  --ink: #211F1B;
  --ink-soft: #6B6658;
  --ink-faint: #A9A392;
  --line: #DAD4C0;
  --accent: #1F6E43;
  --accent-soft: #DCEADF;
  --error: #8B3A3A;
  --mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  --sans: 'Figtree', ui-sans-serif, system-ui, -apple-system, sans-serif;

  font-family: var(--sans);
  color: var(--ink);
  background: var(--page-bg);
  min-height: 100%;
  padding: 28px 14px 48px;
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  align-items: center;
}
.bs-app *, .bs-app *::before, .bs-app *::after { box-sizing: border-box; }

@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Figtree:wght@400;500;600;700&display=swap');

.bs-brand { width: 100%; max-width: 400px; margin-bottom: 18px; }
.bs-brand h1 { font-family: var(--sans); font-size: 22px; font-weight: 700; letter-spacing: -0.01em; margin: 0 0 3px; }
.bs-brand p { font-family: var(--mono); font-size: 12.5px; color: var(--ink-soft); margin: 0; }

.bs-dots { display:flex; gap:6px; margin: 14px 2px 0; }
.bs-dot { width:6px; height:6px; border-radius:50%; background: var(--line); transition: background .2s, transform .2s; }
.bs-dot.on { background: var(--accent); transform: scale(1.25); }

.bs-card {
  position: relative;
  width: 100%;
  max-width: 400px;
  background: var(--paper);
  padding: 30px 22px 26px;
  box-shadow: 0 24px 40px -26px rgba(33,31,27,0.45);
}
.bs-card::before, .bs-card::after {
  content: "";
  position: absolute;
  left: 0; right: 0; height: 11px;
  background-image: radial-gradient(circle at 7px 6px, var(--page-bg) 6px, transparent 6.4px);
  background-size: 18px 11px;
  background-repeat: repeat-x;
}
.bs-card::before { top: -1px; }
.bs-card::after { bottom: -1px; transform: scaleY(-1); }

.bs-step-label { font-family: var(--mono); font-size: 11px; color: var(--ink-faint); margin-bottom: 6px; }
.bs-h2 { font-family: var(--sans); font-size: 19px; font-weight: 700; margin: 0 0 6px; letter-spacing: -0.01em; }
.bs-sub { font-size: 14px; color: var(--ink-soft); line-height: 1.5; margin: 0 0 22px; }

.bs-icon-wrap { width: 64px; height: 64px; border-radius: 50%; background: var(--accent-soft); display: flex; align-items:center; justify-content:center; margin: 4px auto 20px; }

.bs-btn { width: 100%; font-family: var(--sans); font-weight: 600; font-size: 15px; padding: 14px 16px; border-radius: 10px; border: none; cursor: pointer; display: flex; align-items:center; justify-content:center; gap:8px; transition: transform .08s ease, opacity .15s ease; }
.bs-btn:active { transform: scale(0.98); }
.bs-btn-primary { background: var(--ink); color: var(--paper); }
.bs-btn-secondary { background: transparent; color: var(--ink); border: 1.5px solid var(--line); }
.bs-btn-ghost { background: transparent; color: var(--ink-soft); font-weight: 500; font-size: 13.5px; padding: 8px; }
.bs-btn + .bs-btn { margin-top: 10px; }
.bs-btn:disabled { opacity: 0.4; cursor: not-allowed; }

.bs-error { background: #F5E9E7; color: var(--error); font-size: 13px; padding: 10px 12px; border-radius: 8px; margin-bottom: 16px; line-height:1.45; }

.bs-loader { display:flex; flex-direction:column; align-items:center; gap:16px; padding: 30px 0 10px; }
.bs-spinner { width: 34px; height:34px; border-radius:50%; border: 3px solid var(--line); border-top-color: var(--accent); animation: bs-spin 0.8s linear infinite; }
@keyframes bs-spin { to { transform: rotate(360deg); } }
.bs-loader p { font-family: var(--mono); font-size: 12.5px; color: var(--ink-soft); text-align:center; margin:0; }

.bs-ticket-tag { font-family: var(--mono); font-size: 11px; color: var(--ink-faint); margin-bottom: 14px; padding-bottom: 12px; border-bottom: 1px dashed var(--line); }

/* review (editable) rows */
.bs-items { margin: 4px 0 18px; }
.bs-item-row { display:flex; align-items:center; gap:10px; padding: 11px 0; border-bottom: 1px dashed var(--line); }
.bs-item-row:last-child { border-bottom: none; }
.bs-item-name-input { flex: 1; min-width:0; font-family: var(--sans); font-size: 14.5px; font-weight:500; border: none; background: transparent; color: var(--ink); padding: 4px 0; border-bottom: 1px solid transparent; }
.bs-item-name-input:focus { outline:none; border-bottom-color: var(--ink-faint); }
.bs-qty-input, .bs-price-input { font-family: var(--mono); font-size: 13.5px; text-align:right; border: none; border-bottom: 1px solid var(--line); background: transparent; color: var(--ink); padding: 3px 2px; width: 46px; }
.bs-price-input { width: 62px; }
.bs-qty-input:focus, .bs-price-input:focus { outline:none; border-bottom-color: var(--ink); }
.bs-item-x { background:none; border:none; color: var(--ink-faint); font-size: 17px; cursor:pointer; padding: 2px 4px; line-height:1; }
.bs-item-x:hover { color: var(--error); }
.bs-add-item { width:100%; background:none; border: 1.5px dashed var(--line); color: var(--ink-soft); font-family: var(--sans); font-size: 13.5px; font-weight:600; padding: 10px; border-radius: 8px; cursor:pointer; margin-top: 4px; }

/* people setup */
.bs-person-input-row { display:flex; gap:8px; margin-bottom: 16px; }
.bs-person-input { flex:1; font-family: var(--sans); font-size: 14.5px; border: 1.5px solid var(--line); border-radius: 8px; padding: 11px 12px; background: var(--paper); color: var(--ink); }
.bs-person-input:focus { outline:none; border-color: var(--ink); }
.bs-add-person-btn { background: var(--ink); color: var(--paper); border:none; border-radius: 8px; width: 44px; font-size: 20px; cursor:pointer; font-weight: 500; }
.bs-people-list { display:flex; flex-direction:column; gap:8px; margin-bottom: 8px; }
.bs-chip { display:flex; align-items:center; gap:10px; padding: 9px 10px; border-radius: 10px; background: var(--accent-soft); }
.bs-chip-order { font-family: var(--mono); font-size:11px; color: var(--paper); width:20px; height:20px; border-radius:50%; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.bs-chip-name { flex:1; font-weight:600; font-size: 14px; }
.bs-chip button { background: none; border:none; color:var(--ink-faint); width:20px; font-size:16px; cursor:pointer; line-height:1; padding:0; }

/* turn banner (assign mode) */
.bs-turn-banner { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom: 16px; padding-bottom: 14px; border-bottom: 1px dashed var(--line); }
.bs-turn-nav { width:30px; height:30px; border-radius:50%; border:1.5px solid var(--line); background:var(--paper); color:var(--ink); font-size:16px; cursor:pointer; flex-shrink:0; }
.bs-turn-nav:disabled { opacity:0.35; cursor:not-allowed; }
.bs-turn-info { display:flex; flex-direction:column; align-items:center; gap:3px; }
.bs-turn-who { display:flex; align-items:center; gap:7px; font-weight:700; font-size:15.5px; }
.bs-turn-count { font-family: var(--mono); font-size: 11px; color: var(--ink-faint); }

/* ticket rows shared by assign + summary */
.bs-tline { padding: 12px 0; border-bottom: 1px dashed var(--line); }
.bs-tline:last-child { border-bottom: none; }
.bs-tline-main { display:flex; align-items:center; justify-content:space-between; gap:10px; }
.bs-tline-name { font-size: 14.5px; font-weight: 500; flex:1; min-width:0; }
.bs-tline-name b { font-weight:700; }
.bs-tline-right { display:flex; align-items:center; gap:8px; flex-shrink:0; }
.bs-tline-price { font-family: var(--mono); font-size: 13.5px; }
.bs-claim-minus, .bs-claim-plus { width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid var(--line); background: var(--paper); color: var(--ink); font-size: 14px; cursor: pointer; line-height:1; padding:0; }
.bs-claim-plus { border-color: var(--accent); color: var(--accent); font-weight:700; }
.bs-claim-plus:disabled, .bs-claim-minus:disabled { opacity: 0.3; cursor: not-allowed; }
.bs-claim-feedback { font-family: var(--mono); font-size: 11.5px; color: var(--ink-soft); margin-top: 6px; }
.bs-breakdown-line { font-family: var(--mono); font-size: 11.5px; color: var(--ink-soft); margin-top: 6px; }
.bs-shared-note { font-size: 10.5px; color: var(--ink-faint); margin-top: 3px; font-style: italic; }

.bs-turn-total { display:flex; justify-content:space-between; align-items:baseline; margin-top: 16px; padding-top: 14px; border-top: 1.5px solid var(--ink); }
.bs-turn-total-label { font-size: 13.5px; font-weight:600; }
.bs-turn-total-num { font-family: var(--mono); font-weight:700; font-size: 18px; }

.bs-ticket-total-row { display:flex; justify-content:space-between; align-items:baseline; margin-top: 6px; padding-top: 14px; border-top: 1.5px solid var(--ink); }
.bs-ticket-total-label { font-size: 13.5px; font-weight:700; }
.bs-ticket-total-num { font-family: var(--mono); font-weight:700; font-size: 19px; }
.bs-ticket-total-breakdown { font-family: var(--mono); font-size: 11px; color: var(--ink-soft); margin-top: 6px; line-height: 1.6; text-align: right; }
.bs-ticket-total-breakdown span { white-space: nowrap; }

/* per-person summary */
.bs-section-label { font-family: var(--mono); font-size: 11.5px; color: var(--ink-faint); margin: 26px 0 6px; }
.bs-person-block { padding: 14px 0; border-bottom: 1px dashed var(--line); }
.bs-person-block:last-of-type { border-bottom: none; }
.bs-person-block-name { display:flex; align-items:center; gap:8px; font-weight:700; font-size:14.5px; margin-bottom: 8px; }
.bs-person-block-line { display:flex; justify-content:space-between; font-family: var(--mono); font-size: 12.5px; color: var(--ink-soft); padding: 2px 0; }
.bs-person-block-totals { display:flex; justify-content:space-between; align-items:baseline; margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--line); flex-wrap: wrap; gap: 4px 10px; }
.bs-person-block-total-label { font-weight:700; font-size: 13px; }
.bs-person-block-total-num { font-family: var(--mono); font-weight:700; font-size: 14.5px; }
.bs-person-block-tip-num { font-family: var(--mono); font-weight:700; font-size: 14.5px; color: var(--accent); }

.bs-tip-label { font-size: 13.5px; font-weight:600; margin: 22px 0 10px; }
.bs-grand-summary { display:flex; justify-content:space-between; align-items:baseline; flex-wrap:wrap; gap: 6px 16px; margin-top: 18px; padding-top: 14px; border-top: 1.5px solid var(--ink); }
.bs-grand-summary-label { font-weight:700; font-size: 14px; }
.bs-grand-summary-num { font-family: var(--mono); font-weight:700; font-size: 17px; }
.bs-grand-summary-tip-num { font-family: var(--mono); font-weight:700; font-size: 17px; color: var(--accent); }
.bs-tip-buttons { display:flex; gap:8px; margin-bottom: 4px; }
.bs-tip-btn { flex:1; padding: 12px 6px; border-radius: 9px; border: 1.5px solid var(--line); background: var(--paper); font-family: var(--sans); font-weight:700; font-size: 14px; color: var(--ink); cursor:pointer; }
.bs-tip-btn.active { background: var(--accent); color: var(--paper); border-color: var(--accent); }

.bs-swatch { width:9px; height:9px; border-radius:50%; flex-shrink:0; }
.bs-hidden { display:none !important; }
</style>
</head>
<body>

<div class="bs-app" id="bsApp">
  <div class="bs-brand">
    <h1>Divide la cuenta</h1>
    <p id="bsSubtitle">foto → ticket digital → turnos → propina</p>
  </div>
  <div id="bsDots" class="bs-dots"></div>
  <div id="bsCard" class="bs-card"></div>
  <input type="file" id="bsCameraInput" accept="image/*" capture="environment" class="bs-hidden" />
  <input type="file" id="bsFileInput" accept="image/*" class="bs-hidden" />
</div>

<script>
(function(){
  // Esta app le habla a TU PROPIO proxy (ver gemini-worker.js), nunca directo a Gemini
  // con una key visible en el navegador. Despliega el Worker y pon aquí su URL:
  const GEMINI_ENDPOINT = 'https://REEMPLAZA-CON-TU-WORKER.workers.dev';

  const STEPS = ['capture','review','people','assign','summary'];
  const PALETTE = ['#1F6E43','#2A4B7C','#8B3A3A','#6B4E9C','#B8791F','#2F7E7E','#9C4B6B'];

  const state = {
    step: 'capture',
    loadingMsg: '',
    ocrError: '',
    items: [],
    people: [],
    claims: {},
    currentPersonIndex: 0,
    tipPercent: 0
  };

  const app = document.getElementById('bsApp');
  const card = document.getElementById('bsCard');
  const dotsEl = document.getElementById('bsDots');
  const cameraInput = document.getElementById('bsCameraInput');
  const fileInput = document.getElementById('bsFileInput');

  function uid(prefix){ return prefix + '_' + Math.random().toString(36).slice(2,9); }
  function fmt(n){ return '$' + (Math.round((n + Number.EPSILON) * 100) / 100).toFixed(2); }
  function clampNum(v, fallback){ const n = Number(v); return isFinite(n) ? n : fallback; }
  function personColor(idx){ return PALETTE[idx % PALETTE.length]; }
  function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  // ---------- image capture -> resize -> OCR ----------
  function fileToResizedBase64(file){
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onerror = () => reject(new Error('read-failed'));
      reader.onload = (e) => {
        const img = new Image();
        img.onerror = () => reject(new Error('image-failed'));
        img.onload = () => {
          const maxDim = 1280;
          let { width, height } = img;
          if (width > height && width > maxDim) { height = Math.round(height * (maxDim / width)); width = maxDim; }
          else if (height >= width && height > maxDim) { width = Math.round(width * (maxDim / height)); height = maxDim; }
          const canvas = document.createElement('canvas');
          canvas.width = width; canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.fillStyle = '#fff';
          ctx.fillRect(0,0,width,height);
          ctx.drawImage(img, 0, 0, width, height);
          const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
          resolve(dataUrl.split(',')[1]);
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    });
  }

  async function ocrTicket(base64){
    const prompt = 'Analiza esta foto de un ticket o recibo de restaurante. Devuelve UNICAMENTE un objeto JSON valido, sin texto adicional, sin explicaciones y sin bloques de codigo, con exactamente esta forma:\n' +
      '{"items":[{"name":"nombre del producto","qty":numero_entero,"unitPrice":numero}]}\n\n' +
      'Reglas:\n' +
      '- Un elemento del arreglo por cada producto distinto que se consumio, en el mismo orden en que aparece en el ticket.\n' +
      '- "qty" es la cantidad de unidades de ese producto (si no aparece, usa 1).\n' +
      '- "unitPrice" es el precio de una sola unidad, solo el numero, sin simbolo de moneda, usando punto decimal.\n' +
      '- No incluyas subtotal, impuestos, IVA, propina ni el total como productos.\n' +
      '- No agregues comentarios ni texto fuera del JSON.';

    const requestBody = JSON.stringify({
      contents: [{
        parts: [
          { inline_data: { mime_type: 'image/jpeg', data: base64 } },
          { text: prompt }
        ]
      }],
      generationConfig: { responseMimeType: 'application/json' }
    });

    let res;
    const maxAttempts = 3;
    for (let attempt = 1; attempt <= maxAttempts; attempt++) {
      res = await fetch(GEMINI_ENDPOINT, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: requestBody
      });
      if (res.status !== 503 || attempt === maxAttempts) break;
      state.loadingMsg = 'El servicio está saturado, reintentando (' + attempt + '/' + (maxAttempts - 1) + ')…';
      render();
      await new Promise(r => setTimeout(r, 1500 * attempt));
    }

    if (!res.ok) {
      let bodyText = '';
      try { bodyText = await res.text(); } catch(e){}
      console.error('OCR error', res.status, bodyText);
      if (res.status === 503) throw new Error('overloaded');
      throw new Error('http:' + res.status);
    }

    const data = await res.json();
    const textOut = data && data.candidates && data.candidates[0] && data.candidates[0].content &&
      data.candidates[0].content.parts && data.candidates[0].content.parts[0] && data.candidates[0].content.parts[0].text;
    if (!textOut) { console.error('OCR empty response', data); throw new Error('empty'); }
    const clean = textOut.replace(/```json/g, '').replace(/```/g, '').trim();
    let parsed;
    try { parsed = JSON.parse(clean); } catch(e) { console.error('OCR bad JSON', clean); throw new Error('badjson'); }
    if (!parsed.items || !Array.isArray(parsed.items) || parsed.items.length === 0) throw new Error('empty');
    return parsed.items.map((it, i) => ({
      id: uid('it'),
      name: String(it.name || ('Producto ' + (i+1))).trim().slice(0, 60),
      qty: Math.max(1, Math.round(clampNum(it.qty, 1))),
      unitPrice: Math.max(0, clampNum(it.unitPrice, 0))
    }));
  }

  async function handlePhoto(file){
    state.ocrError = '';
    state.step = 'loading';
    state.loadingMsg = 'Leyendo la imagen…';
    render();
    try {
      const base64 = await fileToResizedBase64(file);
      state.loadingMsg = 'Buscando productos y precios…';
      render();
      const items = await ocrTicket(base64);
      state.items = items;
      state.step = 'review';
    } catch (err) {
      const msg = err && err.message ? err.message : '';
      if (msg === 'overloaded') {
        state.ocrError = 'El lector está saturado por demanda alta en este momento. Espera un minuto e intenta de nuevo, o agrega los productos a mano.';
      } else if (msg.indexOf('http:') === 0) {
        state.ocrError = 'El servicio de lectura no está disponible en este momento. Intenta más tarde o agrega los productos a mano.';
      } else {
        state.ocrError = 'No pude leer el ticket con claridad. Intenta con más luz y que se vea completo, o agrega los productos a mano.';
      }
      state.step = 'capture';
    }
    render();
  }

  cameraInput.addEventListener('change', (e) => { const f = e.target.files[0]; if (f) handlePhoto(f); e.target.value=''; });
  fileInput.addEventListener('change', (e) => { const f = e.target.files[0]; if (f) handlePhoto(f); e.target.value=''; });

  // ---------- claim helpers ----------
  function claimCount(itemId, personId){ return (state.claims[itemId] && state.claims[itemId][personId]) || 0; }
  function claimedQtyFor(itemId){
    const c = state.claims[itemId] || {};
    return Object.values(c).reduce((a,b) => a+b, 0);
  }
  function remainingFor(item){ return item.qty - claimedQtyFor(item.id); }

  function personLines(personId){
    const lines = [];
    let sharedTotal = 0;
    state.items.forEach(item => {
      const count = claimCount(item.id, personId);
      if (count > 0) lines.push({ name: item.name, count, subtotal: count * item.unitPrice });
      const remaining = remainingFor(item);
      if (remaining > 0 && state.people.length > 0) sharedTotal += (remaining * item.unitPrice) / state.people.length;
    });
    return { lines, sharedTotal };
  }

  function computeTotals(){
    const personTotals = {};
    state.people.forEach(p => personTotals[p.id] = 0);
    let grandTotal = 0;
    state.items.forEach(item => { grandTotal += item.qty * item.unitPrice; });
    state.people.forEach(p => {
      const { lines, sharedTotal } = personLines(p.id);
      personTotals[p.id] = lines.reduce((a,l) => a + l.subtotal, 0) + sharedTotal;
    });
    return { personTotals, grandTotal };
  }

  // ---------- render ----------
  function render(){
    if (state.step === 'loading') {
      dotsEl.classList.add('bs-hidden');
      card.innerHTML = renderLoading();
      return;
    }
    dotsEl.classList.remove('bs-hidden');
    renderDots();
    card.innerHTML = ({
      capture: renderCapture,
      review: renderReview,
      people: renderPeople,
      assign: renderAssign,
      summary: renderSummary
    })[state.step]();
  }

  function renderDots(){
    const activeIdx = STEPS.indexOf(state.step);
    dotsEl.innerHTML = STEPS.map((s,i) => '<div class="bs-dot' + (i<=activeIdx?' on':'') + '"></div>').join('');
  }


  function renderLoading(){
    return '<div class="bs-loader"><div class="bs-spinner"></div><p>' + state.loadingMsg + '</p></div>';
  }

  function renderCapture(){
    return '' +
      '<div class="bs-step-label">paso 1 de 5</div>' +
      '<div class="bs-icon-wrap">' +
        '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#1F6E43" stroke-width="1.8"><path d="M4 8a2 2 0 0 1 2-2h1.2a1 1 0 0 0 .86-.5l.68-1.14A1 1 0 0 1 9.6 4h4.8a1 1 0 0 1 .86.36l.68 1.14a1 1 0 0 0 .86.5H18a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8Z"/><circle cx="12" cy="13" r="3.4"/></svg>' +
      '</div>' +
      '<h2 class="bs-h2">Toma una foto del ticket</h2>' +
      '<p class="bs-sub">Encuadra el ticket completo, con los productos y precios bien visibles.</p>' +
      (state.ocrError ? '<div class="bs-error">' + state.ocrError + '</div>' : '') +
      '<button class="bs-btn bs-btn-primary" data-action="open-camera">Tomar foto</button>' +
      '<button class="bs-btn bs-btn-secondary" data-action="open-file">Elegir de la galería</button>' +
      '<button class="bs-btn bs-btn-ghost" data-action="manual-entry">Agregar productos a mano</button>';
  }

  function renderReview(){
    const rows = state.items.map(it => '' +
      '<div class="bs-item-row" data-item-id="' + it.id + '">' +
        '<input class="bs-item-name-input" data-field="name" data-id="' + it.id + '" value="' + escapeHtml(it.name) + '" placeholder="Producto" />' +
        '<input class="bs-qty-input" type="number" min="1" step="1" data-field="qty" data-id="' + it.id + '" value="' + it.qty + '" title="cantidad" />' +
        '<input class="bs-price-input" type="number" min="0" step="0.01" data-field="unitPrice" data-id="' + it.id + '" value="' + it.unitPrice + '" title="precio unitario" />' +
        '<button class="bs-item-x" data-action="remove-item" data-id="' + it.id + '">×</button>' +
      '</div>').join('');
    return '' +
      '<div class="bs-step-label">paso 2 de 5</div>' +
      '<h2 class="bs-h2">Revisa el ticket digital</h2>' +
      '<p class="bs-sub">Ajusta nombre, cantidad y precio si algo no quedó bien.</p>' +
      '<div class="bs-items">' + (rows || '<p class="bs-sub" style="margin:0 0 10px">Aún no hay productos.</p>') + '</div>' +
      '<button class="bs-add-item" data-action="add-item">+ Agregar producto</button>' +
      '<div style="height:18px"></div>' +
      '<button class="bs-btn bs-btn-primary" data-action="continue-to-people" ' + (state.items.length===0?'disabled':'') + '>Continuar</button>' +
      '<button class="bs-btn bs-btn-ghost" data-action="back">Volver a tomar la foto</button>';
  }

  function renderPeople(){
    const chips = state.people.map((p,i) => '' +
      '<div class="bs-chip">' +
        '<span class="bs-chip-order" style="background:' + personColor(i) + '">' + (i+1) + '</span>' +
        '<span class="bs-chip-name">' + escapeHtml(p.name) + '</span>' +
        '<button data-action="remove-person" data-id="' + p.id + '">×</button>' +
      '</div>').join('');
    return '' +
      '<div class="bs-step-label">paso 3 de 5</div>' +
      '<h2 class="bs-h2">¿Quiénes van a pagar?</h2>' +
      '<p class="bs-sub">Agrégalos en el orden en que van a elegir sus productos.</p>' +
      '<div class="bs-person-input-row">' +
        '<input class="bs-person-input" id="bsPersonInput" placeholder="Nombre" maxlength="20" />' +
        '<button class="bs-add-person-btn" data-action="add-person">+</button>' +
      '</div>' +
      '<div class="bs-people-list">' + chips + '</div>' +
      '<div style="height:8px"></div>' +
      '<button class="bs-btn bs-btn-primary" data-action="continue-to-assign" ' + (state.people.length===0?'disabled':'') + '>Empezar a elegir</button>' +
      '<button class="bs-btn bs-btn-ghost" data-action="back">Volver a los productos</button>';
  }

  function renderAssign(){
    const person = state.people[state.currentPersonIndex];
    const idx = state.currentPersonIndex;
    const isLast = idx === state.people.length - 1;

    const rows = state.items.map(item => {
      const remaining = remainingFor(item);
      const myCount = claimCount(item.id, person.id);
      const claimText = state.people
        .map((p,i) => ({ p, i, c: claimCount(item.id, p.id) }))
        .filter(x => x.c > 0)
        .map(x => x.c + (x.c === 1 ? ' comprado por ' : ' comprados por ') + escapeHtml(x.p.name))
        .join(' · ');
      return '' +
        '<div class="bs-tline">' +
          '<div class="bs-tline-main">' +
            '<div class="bs-tline-name">' + escapeHtml(item.name) + (item.qty>1 ? ' <span style="color:var(--ink-faint)">×' + item.qty + '</span>' : '') + '</div>' +
            '<div class="bs-tline-right">' +
              '<span class="bs-tline-price">' + fmt(item.unitPrice) + '</span>' +
              '<button class="bs-claim-minus" data-action="dec-claim" data-item="' + item.id + '" ' + (myCount<=0?'disabled':'') + '>−</button>' +
              '<button class="bs-claim-plus" data-action="inc-claim" data-item="' + item.id + '" ' + (remaining<=0?'disabled':'') + '>+</button>' +
            '</div>' +
          '</div>' +
          (claimText ? '<div class="bs-claim-feedback">' + claimText + '</div>' : '') +
        '</div>';
    }).join('');

    const { lines: myLines, sharedTotal } = personLines(person.id);
    const myTotal = myLines.reduce((a,l)=>a+l.subtotal,0) + sharedTotal;

    return '' +
      '<div class="bs-step-label">paso 4 de 5</div>' +
      '<div class="bs-turn-banner">' +
        '<button class="bs-turn-nav" data-action="prev-person" ' + (idx===0?'disabled':'') + '>‹</button>' +
        '<div class="bs-turn-info">' +
          '<div class="bs-turn-who"><span class="bs-swatch" style="background:' + personColor(idx) + '"></span>Turno de ' + escapeHtml(person.name) + '</div>' +
          '<div class="bs-turn-count">' + (idx+1) + ' de ' + state.people.length + '</div>' +
        '</div>' +
        '<button class="bs-turn-nav" data-action="prev-person-nav-next" data-dir="next" ' + (idx>=state.people.length-1?'disabled':'') + '>›</button>' +
      '</div>' +
      '<p class="bs-sub" style="margin-bottom:14px">Toca + junto a lo que pidió ' + escapeHtml(person.name) + '.</p>' +
      '<div>' + rows + '</div>' +
      '<div class="bs-turn-total">' +
        '<div class="bs-turn-total-label">Total de ' + escapeHtml(person.name) + ' antes de propina</div>' +
        '<div class="bs-turn-total-num">' + fmt(myTotal) + '</div>' +
      '</div>' +
      '<div style="height:18px"></div>' +
      (isLast
        ? '<button class="bs-btn bs-btn-primary" data-action="continue-to-summary">Ver el resumen</button>'
        : '<button class="bs-btn bs-btn-primary" data-action="next-person">Siguiente: ' + escapeHtml(state.people[idx+1].name) + '</button>') +
      '<button class="bs-btn bs-btn-ghost" data-action="back">Volver a los nombres</button>';
  }

  function renderSummary(){
    const { personTotals, grandTotal } = computeTotals();
    const tipAmount = grandTotal * (state.tipPercent / 100);

    const itemRows = state.items.map(item => {
      const remaining = remainingFor(item);
      const claimedQty = claimedQtyFor(item.id);
      const breakdown = state.people
        .map(p => ({ p, c: claimCount(item.id, p.id) }))
        .filter(x => x.c > 0)
        .map(x => escapeHtml(x.p.name) + ' ' + x.c + ' (' + fmt(x.c * item.unitPrice) + ')')
        .join(', ');
      return '' +
        '<div class="bs-tline">' +
          '<div class="bs-tline-main">' +
            '<div class="bs-tline-name"><b>' + claimedQty + '</b> ' + escapeHtml(item.name) + '</div>' +
            '<div class="bs-tline-price">' + fmt(item.unitPrice) + '</div>' +
          '</div>' +
          (breakdown ? '<div class="bs-breakdown-line">' + breakdown + '</div>' : '') +
          (remaining > 0 ? '<div class="bs-shared-note">sin asignar: ' + remaining + ' — repartido entre todos (' + fmt(remaining*item.unitPrice) + ')</div>' : '') +
        '</div>';
    }).join('');

    const personBlocks = state.people.map((p,i) => {
      const { lines, sharedTotal } = personLines(p.id);
      const sub = personTotals[p.id] || 0;
      const tipShare = grandTotal > 0 ? (sub / grandTotal) * tipAmount : 0;
      const final = sub + tipShare;
      const lineHtml = lines.map(l => '<div class="bs-person-block-line"><span>' + escapeHtml(l.name) + (l.count>1?' ×'+l.count:'') + '</span><span>' + fmt(l.subtotal) + '</span></div>').join('');
      const sharedHtml = sharedTotal > 0.004 ? '<div class="bs-person-block-line"><span>parte de lo compartido</span><span>' + fmt(sharedTotal) + '</span></div>' : '';
      return '' +
        '<div class="bs-person-block">' +
          '<div class="bs-person-block-name"><span class="bs-swatch" style="background:' + personColor(i) + '"></span>' + escapeHtml(p.name) + '</div>' +
          lineHtml + sharedHtml +
          '<div class="bs-person-block-totals">' +
            '<span class="bs-person-block-total-label">Total antes de propina: <span class="bs-person-block-total-num">' + fmt(sub) + '</span></span>' +
            (state.tipPercent > 0 ? '<span class="bs-person-block-total-label">Total con propina: <span class="bs-person-block-tip-num">' + fmt(final) + '</span></span>' : '') +
          '</div>' +
        '</div>';
    }).join('');

    const tipBtn = (pct) => '<button class="bs-tip-btn' + (state.tipPercent===pct?' active':'') + '" data-action="select-tip" data-pct="' + pct + '">' + pct + '%</button>';

    return '' +
      '<div class="bs-step-label">paso 5 de 5</div>' +
      '<h2 class="bs-h2">Resumen del ticket</h2>' +
      '<div>' + itemRows + '</div>' +
      '<div class="bs-ticket-total-row">' +
        '<div class="bs-ticket-total-label">Total del ticket</div>' +
        '<div class="bs-ticket-total-num">' + fmt(grandTotal) + '</div>' +
      '</div>' +
      '<div class="bs-ticket-total-breakdown">' +
        state.people.map((p,i) => '<span>' + escapeHtml(p.name) + ' ' + fmt(personTotals[p.id] || 0) + '</span>').join(' + ') +
      '</div>' +
      '<div class="bs-section-label">por persona</div>' +
      '<div>' + personBlocks + '</div>' +
      '<div class="bs-grand-summary">' +
        '<span class="bs-grand-summary-label">Total antes de propina: <span class="bs-grand-summary-num">' + fmt(grandTotal) + '</span></span>' +
        (state.tipPercent > 0 ? '<span class="bs-grand-summary-label">Total con propina: <span class="bs-grand-summary-tip-num">' + fmt(grandTotal + tipAmount) + '</span></span>' : '') +
      '</div>' +
      '<div class="bs-tip-label">Propina</div>' +
      '<div class="bs-tip-buttons">' + tipBtn(0) + tipBtn(10) + tipBtn(15) + tipBtn(20) + '</div>' +
      '<div style="height:18px"></div>' +
      '<button class="bs-btn bs-btn-secondary" data-action="back">Volver a elegir productos</button>' +
      '<button class="bs-btn bs-btn-ghost" data-action="start-over">Empezar con otro ticket</button>';
  }

  // ---------- interactions ----------
  const prevStepMap = { review:'capture', people:'review', assign:'people', summary:'assign' };

  app.addEventListener('click', (e) => {
    const btn = e.target.closest('[data-action]');
    if (!btn) return;
    const action = btn.dataset.action;

    if (action === 'open-camera') return cameraInput.click();
    if (action === 'open-file') return fileInput.click();

    if (action === 'manual-entry') {
      state.items = [{ id: uid('it'), name: '', qty: 1, unitPrice: 0 }];
      state.ocrError = '';
      state.step = 'review';
      return render();
    }

    if (action === 'add-item') { state.items.push({ id: uid('it'), name: '', qty: 1, unitPrice: 0 }); return render(); }
    if (action === 'remove-item') { state.items = state.items.filter(it => it.id !== btn.dataset.id); return render(); }
    if (action === 'continue-to-people') {
      state.items = state.items.filter(it => it.name.trim() !== '' || it.unitPrice > 0);
      if (state.items.length === 0) return;
      state.step = 'people';
      return render();
    }

    if (action === 'add-person') return addPerson();
    if (action === 'remove-person') { state.people = state.people.filter(p => p.id !== btn.dataset.id); return render(); }
    if (action === 'continue-to-assign') {
      if (state.people.length === 0) return;
      state.items.forEach(it => { if (!state.claims[it.id]) state.claims[it.id] = {}; });
      state.currentPersonIndex = 0;
      state.step = 'assign';
      return render();
    }

    if (action === 'inc-claim' || action === 'dec-claim') {
      const itemId = btn.dataset.item;
      const person = state.people[state.currentPersonIndex];
      if (!person) return;
      const item = state.items.find(it => it.id === itemId);
      if (!item) return;
      if (!state.claims[itemId]) state.claims[itemId] = {};
      const cur = state.claims[itemId][person.id] || 0;
      if (action === 'inc-claim') { if (claimedQtyFor(itemId) < item.qty) state.claims[itemId][person.id] = cur + 1; }
      else { if (cur > 0) state.claims[itemId][person.id] = cur - 1; }
      return render();
    }

    if (action === 'prev-person') { state.currentPersonIndex = Math.max(0, state.currentPersonIndex - 1); return render(); }
    if (action === 'prev-person-nav-next') { state.currentPersonIndex = Math.min(state.people.length - 1, state.currentPersonIndex + 1); return render(); }
    if (action === 'next-person') { state.currentPersonIndex = Math.min(state.people.length - 1, state.currentPersonIndex + 1); return render(); }

    if (action === 'continue-to-summary') { state.step = 'summary'; return render(); }
    if (action === 'select-tip') { state.tipPercent = Number(btn.dataset.pct); return render(); }

    if (action === 'back') { state.step = prevStepMap[state.step] || 'capture'; return render(); }
    if (action === 'start-over') {
      state.step = 'capture'; state.items = []; state.people = []; state.claims = {}; state.currentPersonIndex = 0; state.tipPercent = 0; state.ocrError = '';
      return render();
    }
  });

  function addPerson(){
    const input = document.getElementById('bsPersonInput');
    if (!input) return;
    const name = input.value.trim();
    if (!name) return;
    state.people.push({ id: uid('p'), name: name.slice(0,20) });
    input.value = '';
    render();
    const again = document.getElementById('bsPersonInput');
    if (again) again.focus();
  }

  app.addEventListener('keydown', (e) => {
    if (e.target && e.target.id === 'bsPersonInput' && e.key === 'Enter') { e.preventDefault(); addPerson(); }
  });

  app.addEventListener('input', (e) => {
    const field = e.target.dataset ? e.target.dataset.field : null;
    if (!field) return;
    const id = e.target.dataset.id;
    const item = state.items.find(it => it.id === id);
    if (!item) return;
    if (field === 'name') item.name = e.target.value;
    if (field === 'qty') item.qty = Math.max(1, Math.round(clampNum(e.target.value, 1)));
    if (field === 'unitPrice') item.unitPrice = Math.max(0, clampNum(e.target.value, 0));
  });

  render();
})();
</script>
</body>
</html>
